# Nginx cho Dashboard frontend trong k8s
# - Serve static SPA (React build) trên cổng 80
# - Reverse-proxy /api/* sang Dashboard backend (FastAPI) qua Service nội bộ
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không phải file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health: forward sang backend service trong namespace crypto-trend.
    # "dashboard-backend" là tên Service, 8000 là cổng FastAPI.
    location /api/ {
        proxy_pass http://dashboard-backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://dashboard-backend:8000/health;
    }
}
