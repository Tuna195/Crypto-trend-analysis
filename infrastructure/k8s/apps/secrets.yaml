# =============================================================================
# FILE: secrets.yaml
#
# Cách áp dụng:
#   1. Tạo secret env trước từ file .env (thay thế cho nội dung bên dưới):
#
#      kubectl create secret generic ingestion-env-secret \
#        --namespace=crypto-trend \
#        --from-literal=RAPIDAPI_KEYS="<dán chuỗi keys từ .env>" \
#        --from-literal=RAPIDAPI_HOST="twitter-api45.p.rapidapi.com" \
#        --from-literal=KAFKA_HOST="<KAFKA_HOST từ .env>" \
#        --from-literal=KAFKA_PORT="<KAFKA_PORT từ .env>" \
#        --from-literal=KAFKA_TOPIC_MARKET="raw-tweets-market" \
#        --from-literal=KAFKA_TOPIC_WHALES="raw-tweets-whales" \
#        --from-literal=TRACKED_COINS="BTC,ETH,SOL,XRP,ADA,BNB,DOGE,AVAX" \
#        --from-literal=TRACKED_WHALES="elonmusk,saylor,VitalikButerin,cz_binance,brian_armstrong,justinsuntron,CryptoKaleo,Pentosh1" \
#        --from-literal=HISTORICAL_DAYS_TO_FETCH="180" \
#        --from-literal=WEBHDFS_URL="http://namenode:9870" \
#        --from-literal=HDFS_USER="hdfs" \
#        --from-literal=HDFS_BASE_DIR="/data/crypto"
#
#   2. Tạo secret certs từ file PEM thực tế (KHÔNG commit file cert vào git):
#
#      kubectl create secret generic kafka-ssl-secret \
#        --namespace=crypto-trend \
#        --from-file=ca.pem=src/ingestion/certs/ca.pem \
#        --from-file=service.cert=src/ingestion/certs/service.cert \
#        --from-file=service.key=src/ingestion/certs/service.key
#
#   3. Xác nhận đã tạo xong:
#      kubectl get secrets -n crypto-trend
#
# QUAN TRỌNG: File YAML bên dưới chỉ là TEMPLATE tham khảo cấu trúc.
# KHÔNG điền giá trị thật vào đây. Hãy dùng lệnh kubectl create secret ở trên.
# =============================================================================

---
# Secret 1: Biến môi trường cho ingestion (template — dùng lệnh kubectl bên trên thay thế)
apiVersion: v1
kind: Secret
metadata:
  name: ingestion-env-secret
  namespace: crypto-trend
type: Opaque
stringData:
  RAPIDAPI_KEYS: "FILL_FROM_ENV"
  RAPIDAPI_HOST: "twitter-api45.p.rapidapi.com"
  KAFKA_HOST: "FILL_FROM_ENV"
  KAFKA_PORT: "FILL_FROM_ENV"
  KAFKA_TOPIC_MARKET: "raw-tweets-market"
  KAFKA_TOPIC_WHALES: "raw-tweets-whales"
  TRACKED_COINS: "BTC,ETH,SOL,XRP,ADA,BNB,DOGE,AVAX"
  TRACKED_WHALES: "elonmusk,saylor,VitalikButerin,cz_binance,brian_armstrong,justinsuntron,CryptoKaleo,Pentosh1"
  HISTORICAL_DAYS_TO_FETCH: "180"
  WEBHDFS_URL: "http://namenode:9870"
  HDFS_USER: "hdfs"
  HDFS_BASE_DIR: "/data/crypto"

---
# Secret 2: SSL Certificates cho Aiven Kafka (template — dùng lệnh kubectl bên trên thay thế)
# Các file cert sẽ được mount vào /etc/kafka/certs/ bên trong container
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ssl-secret
  namespace: crypto-trend
type: Opaque
stringData:
  ca.pem: "FILL_FROM_FILE_src/ingestion/certs/ca.pem"
  service.cert: "FILL_FROM_FILE_src/ingestion/certs/service.cert"
  service.key: "FILL_FROM_FILE_src/ingestion/certs/service.key"
