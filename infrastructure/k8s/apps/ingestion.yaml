# =============================================================================
# FILE: ingestion.yaml
#
# Chứa 3 object:
#   1. Job          — historical_scraper.py   (chạy 1 lần duy nhất khi apply)
#   2. CronJob      — twitter_client.py       (chạy mỗi 1 giờ)
#   3. CronJob      — whale_client.py         (chạy mỗi 3 giờ)
#
# Yêu cầu trước khi apply:
#   - Đã tạo 2 secret: ingestion-env-secret và kafka-ssl-secret (xem secrets.yaml)
#   - Đã build và load Docker image vào Kind cluster:
#       docker build -t crypto-ingestion:latest .
#       kind load docker-image crypto-ingestion:latest --name <tên-cluster>
#   - Namespace crypto-trend đã được tạo:
#       kubectl apply -f infrastructure/k8s/storage/namespace.yaml
#
# Cách apply:
#   kubectl apply -f infrastructure/k8s/apps/ingestion.yaml
#
# Kiểm tra:
#   kubectl get job,cronjob -n crypto-trend
#   kubectl logs job/historical-scraper -n crypto-trend -f
# =============================================================================

---
# ─────────────────────────────────────────────────────────────────
# 1. JOB: historical_scraper.py — Chạy 1 lần duy nhất
#    Mục đích: Cào toàn bộ dữ liệu lịch sử trước khi hệ thống đi vào
#    vận hành định kỳ. Job tự động kết thúc sau khi script hoàn tất.
# ─────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: historical-scraper
  namespace: crypto-trend
  labels:
    app: historical-scraper
    type: one-time-job
spec:
  # Không tự động retry nếu thất bại (tránh lãng phí API quota)
  backoffLimit: 0
  # Tự xóa pod log sau 7 ngày
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: historical-scraper
    spec:
      restartPolicy: Never
      containers:
        - name: historical-scraper
          image: crypto-ingestion:v2
          imagePullPolicy: Never  # Kind: dùng image đã load local
          command: ["python", "src/ingestion/historical_scraper.py"]
          # Nạp toàn bộ biến môi trường từ Secret
          envFrom:
            - secretRef:
                name: ingestion-env-secret
          # Ghi đè đường dẫn certs để trỏ vào volume mount
          env:
            - name: TZ
              value: "Asia/Ho_Chi_Minh"
            - name: KAFKA_CERTS_DIR
              value: "/etc/kafka/certs"
          # Mount 3 file cert PEM vào /etc/kafka/certs/
          volumeMounts:
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/certs
              readOnly: true
      volumes:
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret

---
# ─────────────────────────────────────────────────────────────────
# 2. CRONJOB: twitter_client.py — Quét xu hướng thị trường mỗi 20 phút
#    Lịch: mỗi 20 phút (*/20 * * * *)
#    Ví dụ: 00:00, 00:20, 00:40, 01:00, ...
# ─────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-trend-ingestion
  namespace: crypto-trend
  labels:
    app: market-trend-ingestion
    type: scheduled-crawl
spec:
  # Chạy mỗi 20 phút
  schedule: "*/20 * * * *"
  timeZone: "Asia/Ho_Chi_Minh"
  # Nếu job trước chưa xong thì bỏ qua lần này (tránh chồng chéo request)
  concurrencyPolicy: Forbid
  # Giữ lại log của 3 lần chạy gần nhất để debug
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Tự động retry tối đa 2 lần nếu thất bại (API timeout, mạng...)
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: market-trend-ingestion
        spec:
          restartPolicy: OnFailure
          containers:
            - name: market-trend-ingestion
              image: crypto-ingestion:v2
              imagePullPolicy: Never
              command: ["python", "src/ingestion/twitter_client.py"]
              envFrom:
                - secretRef:
                    name: ingestion-env-secret
              env:
                - name: TZ
                  value: "Asia/Ho_Chi_Minh"
                - name: KAFKA_CERTS_DIR
                  value: "/etc/kafka/certs"
              volumeMounts:
                - name: kafka-ssl-certs
                  mountPath: /etc/kafka/certs
                  readOnly: true
          volumes:
            - name: kafka-ssl-certs
              secret:
                secretName: kafka-ssl-secret
